name: Test superglue_js
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test superglue.js
    strategy:
      fail-fast: false

    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Setup project
        working-directory: .
        run: npm install
      - name: Lint
        working-directory: .
        run: npm run lint
      - name: Test
        working-directory: .
        run: npm run test
